{% extends 'layout.html' %} 
{% block content %} 
<div class="container"> 
    <h1>Text Analyzer</h1> 
    <form action="/post" method="POST"> 
        <div> 
            <textarea rows="15" name="content" autofocus placeholder="Paste or type your text here..."></textarea> 
        </div> 
        <div> 
            <input type="submit" class="btn" value="Process Text" /> 
        </div> 
    </form> 
</div> 
{% endblock %}
